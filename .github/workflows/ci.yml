# -----------------------------------------------------------------------------
# SoC layer      : CI (Temps 1 of controlled vibe coding, I40)
# Responsibility : Run the test suite on every pull request to main, and refuse
#                  a pull request that changes a protected file
# Never does     : Deploy, hold a secret, or call a real LLM (tests are offline)
# Reference      : 03_VIBE_CODING_CONTROLE.md T06 ; .github/protected_paths.txt
# -----------------------------------------------------------------------------
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install torch (CPU build, same version as requirements.txt)
        run: python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Run tests (offline)
        run: python -m pytest -q

  protected-paths:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse changes to protected files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The list is read from main (the base), never from the pull request itself.
          git show "$BASE_SHA:.github/protected_paths.txt" > /tmp/protected.txt
          changed=$(git diff --name-only "$BASE_SHA"...HEAD)
          echo "Files changed by this pull request:"; echo "$changed"
          fail=0
          while IFS= read -r p; do
            case "$p" in ""|\#*) continue ;; esac
            # A line ending in "/" protects a whole folder; otherwise one exact file.
            hits=$(echo "$changed" | awk -v p="$p" '(substr(p,length(p))=="/") ? index($0,p)==1 : $0==p')
            if [ -n "$hits" ]; then echo "::error::Protected file changed: $hits"; fail=1; fi
          done < /tmp/protected.txt
          exit $fail
